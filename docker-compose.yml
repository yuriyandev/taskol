version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_${PROJECT}
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
    depends_on:
      php:
        condition: service_healthy
    mem_limit: 64m

  php:
    build: ./php
    container_name: php_${PROJECT}
    expose:
      - "9004"
      - "9005"
    healthcheck:
      test: ["CMD", "php", "-r", "echo 1;"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DB_HOST: mysql_${PROJECT}
      DB_NAME: ${MYSQL_DB}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./www:/var/www/html
      - ./logs/php:/var/log/php
    depends_on:
      - mysql
    mem_limit: 128m

  mysql:
    image: mysql:8.0
    container_name: mysql_${PROJECT}
    restart: always
    command: --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    mem_limit: 256m

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_${PROJECT}
    environment:
      PMA_HOST: mysql_${PROJECT}
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 128M
      PHP_MAX_EXECUTION_TIME: 600
      PHP_SESSION_SAVE_PATH: /phpmyadmin_sessions
    ports:
      - "8083:80"
    depends_on:
      - mysql
    tmpfs:
      - /phpmyadmin_sessions
    mem_limit: 128m

volumes:
  mysql_data:
